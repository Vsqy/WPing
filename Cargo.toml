[package]
name = "wping"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "wping"
path = "src/main.rs"

[[bin]]
name = "WPing_Setup"
path = "src/setup.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.29"
tray-item = "0.10"
windows-sys = { version = "0.52", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
] }

[profile.release]
strip = true
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
